<!DOCTYPE html>
<html lang="es">

        body { font-family: system-ui, sans-serif; margin: 1rem; max-width: 40rem; }
        #aviso-cookies { background: #eee; padding: 0.8rem; }

    <script src="./main.js" defer></script>

<body>
    <h1>¿Qué tema quieres repasar?</h1>
