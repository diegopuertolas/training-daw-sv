<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reto · carrito de la compra</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 1rem; display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; }
        #catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: 1rem; }
        .tarjeta { border: 1px solid #ccc; border-radius: 0.5rem; padding: 0.8rem; }
        .tarjeta.agotado { opacity: 0.5; }
        #carrito li { display: flex; gap: 0.4rem; align-items: center; padding: 0.2rem 0; }
        #carrito li .nombre { flex: 1; }
        #total { font-weight: bold; }
        #descuento:invalid { border-color: #c00; }
    </style>
    <script src="./main.js" defer></script>
    <script src="./test.js" defer></script>
</head>
<body>
    <main>
        <h1>Tienda</h1>
        <div id="catalogo"></div>
    </main>
    <aside>
        <h2>Carrito</h2>
        <ul id="carrito"></ul>
        <p id="vacio">El carrito está vacío.</p>
        <form id="form-descuento">
            <label for="descuento">Código de descuento</label>
            <input id="descuento" name="descuento" placeholder="DAW10">
            <button>Aplicar</button>
        </form>
        <p>Total: <span id="total">0.00 €</span></p>
        <button id="vaciar">Vaciar carrito</button>
    </aside>
</body>
</html>
